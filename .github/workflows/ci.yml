name: Portable application checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable && corepack prepare pnpm@12.7.0 --activate
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit:history
      - run: pnpm check
      - run: pnpm build:full
      - run: pnpm --filter @t3-designer/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e:fast
      - run: pnpm test:analytics
      - run: pnpm test:accounts
      - run: pnpm test:demo
      - run: pnpm test:anonymous
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-browser-evidence
          path: apps/web/test-results/
          retention-days: 5

  role-regressions:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: admin
            command: pnpm test:admin
          - role: owner
            command: pnpm test:owner
          - role: owner-webgl
            command: T3_QA_WEBGL=true pnpm test:owner
          - role: shared-editor
            command: pnpm test:shared-editor --project chromium-mobile-narrow --project chromium-mobile-wide --project chromium-desktop
          - role: viewer
            command: pnpm test:viewer
          - role: anonymous-webgl
            command: pnpm test:anonymous:webgl
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable && corepack prepare pnpm@12.7.0 --activate
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @t3-designer/web exec playwright install --with-deps chromium
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: role-${{ matrix.role }}-browser-evidence
          retention-days: 5
          path: |
            artifacts/qa-global-admin/browser/
            artifacts/qa-global-admin/results.json
            artifacts/owner-qa/*/browser-results/
            artifacts/owner-qa/*/results.json
            artifacts/qa-project-viewer/final/results/
            artifacts/qa-project-viewer/final/results.json
            /tmp/t3-shared-editor-results/
            /tmp/t3-shared-editor-report.json
            apps/web/test-results/anonymous/
