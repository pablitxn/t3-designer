stages: [quality, browser]

variables:
  GIT_DEPTH: "0"

default:
  interruptible: true
  retry:
    max: 1
    when: runner_system_failure

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

.node:
  image: node:24-bookworm@sha256:5a750d3be5e5c80275f8c9a5367c3aed99c2875656590c8d0701c7ee687f5f0a
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends python3
    - corepack enable
    - corepack prepare pnpm@12.7.0 --activate
    - pnpm install --frozen-lockfile --ignore-scripts

quality:
  extends: .node
  stage: quality
  script:
    - pnpm audit:history
    - pnpm check
    - pnpm build:full
    - pnpm build:demo
  artifacts:
    paths: [apps/web/dist/]
    expire_in: 7 days

browser:
  extends: .node
  stage: browser
  needs: [quality]
  script:
    - pnpm --filter @t3-designer/web exec playwright install --with-deps chromium
    - pnpm test:e2e:fast
    - pnpm test:analytics
    - pnpm test:accounts
    - pnpm test:demo
  artifacts:
    when: always
    paths: [apps/web/test-results/]
    expire_in: 1 day

# Image publishing and production promotion are operator workflows. This public
# pipeline has no required runner tags, private includes or deployment secrets.
